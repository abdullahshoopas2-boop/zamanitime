      const occ = ISLAMIC_OCCASIONS.find(o => o.id === occasionId);
      if (!occ) return null;
      const nowMs = now.getTime();
      for (const item of occ.occurrences) {
        const startMs = new Date(item.targetDate).getTime();
        const endMs = new Date(item.endDate).getTime();
        if (nowMs >= startMs && nowMs <= endMs) {
          return { ...item, occasion: occ, isOngoing: true, targetDateObj: new Date(item.endDate) };
        }
        if (startMs > nowMs) {
          return { ...item, occasion: occ, isOngoing: false, targetDateObj: new Date(item.targetDate) };
        }
      }
      const last = occ.occurrences[occ.occurrences.length - 1];
      return { ...last, occasion: occ, isOngoing: false, targetDateObj: new Date(last.targetDate) };

      const diffMs = targetMs - now.getTime();
      if (diffMs <= 0) {
        return { isPast: true, days: 0, hours: 0, minutes: 0, seconds: 0, daysFmt: '00', hoursFmt: '00', minFmt: '00', secFmt: '00' };
      }
      const totalSeconds = Math.floor(diffMs / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return {
        isPast: false,
        days, hours, minutes, seconds,
        daysFmt: String(days).padStart(2, '0'),
        hoursFmt: String(hours).padStart(2, '0'),
        minFmt: String(minutes).padStart(2, '0'),
        secFmt: String(seconds).padStart(2, '0')
      };
    }

    function formatDateDisplay(dateStr, lang = 'ar') {
      const d = new Date(dateStr);
      const locale = lang === 'ar' ? 'ar-EG' : (lang === 'hi' ? 'hi-IN' : 'en-US');
      try {
        return new Intl.DateTimeFormat(locale, { year: 'numeric', month: 'short', day: 'numeric' }).format(d);
      } catch {
        return dateStr.split('T')[0];
      }
    }

    // --- HIGH-RES CANVAS CARD RENDERER ---
    function drawGreetingCard(canvas, { occasionTitle, recipient, message, sender, theme, lang }) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const width = 1200;
      const height = 1200;
      canvas.width = width;
      canvas.height = height;

      const colors = theme || CARD_THEMES[0];

      // Radial background
      const grad = ctx.createRadialGradient(width / 2, height / 2, 80, width / 2, height / 2, width * 0.75);
      grad.addColorStop(0, colors.canvasBg[1]);
      grad.addColorStop(0.65, colors.canvasBg[0]);
      grad.addColorStop(1, colors.canvasBg[2]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Star particles
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      const stars = [[160, 180, 2], [320, 120, 1.5], [880, 140, 2], [1040, 220, 1.5], [190, 960, 1.5], [1010, 990, 2], [600, 110, 2.5]];
      stars.forEach(([x, y, r]) => {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Double borders
      const outerMargin = 45;
      const innerMargin = 60;
      const gold = colors.canvasGold;

      ctx.strokeStyle = gold;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5;
      ctx.strokeRect(outerMargin, outerMargin, width - outerMargin * 2, height - outerMargin * 2);

      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.85;
      ctx.strokeRect(innerMargin, innerMargin, width - innerMargin * 2, height - innerMargin * 2);

      // Corner ornaments
      const corners = [
        [innerMargin, innerMargin, 1, 1],
        [width - innerMargin, innerMargin, -1, 1],
        [innerMargin, height - innerMargin, 1, -1],
        [width - innerMargin, height - innerMargin, -1, -1]
      ];
      ctx.lineWidth = 2.5;
      corners.forEach(([cx, cy, dx, dy]) => {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.moveTo(dx * 35, 0);
        ctx.lineTo(0, 0);
        ctx.lineTo(0, dy * 35);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(dx * 14, dy * 14, 4, 0, Math.PI * 2);
        ctx.fillStyle = gold;
        ctx.fill();
        ctx.restore();
      });

      ctx.globalAlpha = 1.0;

      // Crescent & Star top
      const cx = width / 2;
      const cy = 175;
      ctx.save();
      ctx.fillStyle = gold;
      ctx.beginPath();
      ctx.arc(cx - 6, cy, 32, -Math.PI / 2, Math.PI / 2, false);
      ctx.arc(cx + 8, cy, 26, Math.PI / 2, -Math.PI / 2, true);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Occasion Title
      ctx.textAlign = 'center';
      ctx.fillStyle = gold;
      ctx.font = `bold 54px ${lang === 'hi' ? '"Noto Sans Devanagari"' : '"Amiri", "Alexandria", serif'}`;
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.fillText(occasionTitle, width / 2, 280);

      // Ornamental Divider
      ctx.strokeStyle = gold;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(width / 2 - 180, 320);
      ctx.lineTo(width / 2 - 20, 320);
      ctx.moveTo(width / 2 + 20, 320);
      ctx.lineTo(width / 2 + 180, 320);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(width / 2, 320, 5, 0, Math.PI * 2);
      ctx.fillStyle = gold;
      ctx.fill();

      // Recipient
      if (recipient && recipient.trim()) {
        ctx.font = `500 36px ${lang === 'hi' ? '"Noto Sans Devanagari"' : '"Alexandria", "Cairo", sans-serif'}`;
        ctx.fillStyle = colors.canvasSubtext;
        const prefix = lang === 'ar' ? 'إلى: ' : (lang === 'hi' ? 'सेवा में: ' : 'To: ');
        ctx.fillText(`${prefix}${recipient.trim()}`, width / 2, 400);
      }

      // Main Message
      ctx.font = `400 34px ${lang === 'hi' ? '"Noto Sans Devanagari"' : '"Alexandria", "Cairo", sans-serif'}`;
      ctx.fillStyle = colors.canvasText;
      const startY = recipient && recipient.trim() ? 470 : 420;
      const words = (message || '').split(/\s+/);
      const lines = [];
      let currentLine = words[0] || '';
      for (let i = 1; i < words.length; i++) {
        const test = `${currentLine} ${words[i]}`;
        if (ctx.measureText(test).width < 860) {
          currentLine = test;
        } else {
          lines.push(currentLine);
          currentLine = words[i];
        }
      }
      if (currentLine) lines.push(currentLine);

      const lineHeight = 56;
      lines.forEach((l, idx) => {
        ctx.fillText(l, width / 2, startY + idx * lineHeight);
      });

      // Sender
      if (sender && sender.trim()) {
        const fromY = Math.max(startY + lines.length * lineHeight + 70, 940);
        ctx.font = `600 36px ${lang === 'hi' ? '"Noto Sans Devanagari"' : '"Alexandria", "Cairo", sans-serif'}`;
        ctx.fillStyle = colors.canvasSubtext;
        const fromPrefix = lang === 'ar' ? 'من: ' : (lang === 'hi' ? 'प्रेषक: ' : 'From: ');
        ctx.fillText(`${fromPrefix}${sender.trim()}`, width / 2, fromY);
      }

      // Discreet branding
      ctx.shadowBlur = 0;
      ctx.font = '400 20px "Outfit", sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillText('زماني • ZAMANI', width / 2, height - 75);
    }

                          className="w-full py-3 px-4 rounded-xl font-semibold text-sm bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-stone-950 shadow-md flex items-center justify-center gap-2 transition-all"
                        >
                          <span>💾</span>
                          <span>{t('cardDownloadPng')}</span>
                        </button>

                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={handleShareWhatsApp}
                            className="py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm bg-[#25D366] hover:bg-[#20ba59] text-white flex items-center justify-center gap-1.5 transition-all shadow-sm"
                          >
                            <span>💬</span>
                            <span>{t('cardShareWhatsApp')}</span>
                          </button>
                          <button
                            type="button"
                            onClick={handleCopyText}
                            className="py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-800 dark:text-stone-200 border border-stone-200 dark:border-stone-700 flex items-center justify-center gap-1.5 transition-all"
                          >
                            <span>📋</span>
                            <span>{t('cardCopyText')}</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}
          </main>

          {/* Footer */}
          <footer className="mt-20 border-t border-stone-200/80 dark:border-stone-800 bg-white/40 dark:bg-stone-950/40 backdrop-blur-sm py-12 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-start">
                <div className="space-y-2 max-w-md">
                  <div className="flex items-center justify-center md:justify-start gap-2.5">
                    <span className="text-2xl">🌙</span>
                    <span className="text-xl font-bold text-stone-900 dark:text-stone-100">
                      {t('appName')}
                    </span>
                  </div>
                  <p className="text-xs text-stone-500 dark:text-stone-400 leading-relaxed">
                    {t('footerNote')}
                  </p>
                </div>

                <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-semibold text-stone-600 dark:text-stone-400">
                  <button type="button" onClick={() => { setActiveTab('islamic'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-emerald-600">
                    {t('navIslamic')}
                  </button>
                  <span>•</span>
                  <button type="button" onClick={() => { setActiveTab('academic'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-emerald-600">
                    {t('navAcademic')}
                  </button>
                  <span>•</span>
                  <button type="button" onClick={() => { setActiveTab('studio'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="hover:text-emerald-600">
                    {t('navStudio')}
                  </button>
                </div>

                <div className="text-xs text-stone-400 dark:text-stone-500 space-y-1 md:text-end">
                  <div>
                    © {now.getFullYear()} {t('appName')}. {t('allRightsReserved')}.
                  </div>
                  <div className="text-[11px] opacity-75">
                    {Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'}
                  </div>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
